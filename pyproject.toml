[project]
name = "real-time-fraud-intelligence"
version = "0.1.0"
description = "Real-time fraud detection and risk intelligence platform: ML pipeline and scoring API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # ML / data
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "scikit-learn>=1.6,<2",
    "xgboost>=3.0,<4",
    "pandera>=0.24",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "optuna>=4.2",
    "imbalanced-learn>=0.13",
    "mlflow>=3.0",
    "redis>=5.2",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/fraud_ml", "apps/api/fraud_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL (docker compose up -d postgres)",
    "dataset: requires the downloaded dataset under ml/data/raw",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"apps/api/migrations/**" = ["E501"]
# Operator load-test tool: runs fixed argv (psql, ps, docker); random.Random only shuffles load.
"scripts/load_test.py" = ["S603", "S607", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["apps/api/migrations/"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_ml", "fraud_api", "tests"]
