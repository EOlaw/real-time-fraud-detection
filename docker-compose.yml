# Local development stack. Credentials come from .env (see .env.example); none are hardcoded.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Streams for event ingestion (Phase 5). AOF persistence with fsync every second: an
    # acknowledged ingest can be lost only if Redis crashes within that second.
    image: redis:7.4.2-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set in .env}
      --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      FRAUD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRAUD_JWT_SECRET: ${FRAUD_JWT_SECRET:?set in .env}
      FRAUD_MODEL_DIR: /app/model
      FRAUD_POLICY_PATH: /app/ml/configs/decision_policy.yaml
      FRAUD_FAILURE_MODE: ${FRAUD_FAILURE_MODE:-manual_review}
    volumes:
      # Trained artifact mounted read-only; produce it with `make train`.
      - ./ml/artifacts/current:/app/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["api"]

  # Phase 9 local observability: `make monitoring-up` (needs FRAUD_METRICS_TOKEN in .env, written
  # to infrastructure/monitoring/secrets/metrics_token by `make monitoring-token`).
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infrastructure/monitoring/secrets:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}  # required by make monitoring-up
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    profiles: ["monitoring"]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
